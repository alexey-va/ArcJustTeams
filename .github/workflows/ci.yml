name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', '.agents/**', '.codex/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', '.agents/**', '.codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arcjustteams-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Test and package the standalone addon
        run: ./gradlew --no-daemon --build-cache test shadowJar
      - name: Verify arc-core consumer architecture
        uses: alexey-va/arc-core/.github/actions/verify-consumer@7606a5039876f3f949657655e5364f41593aa8dd
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ArcJustTeams-reports-${{ github.sha }}
          retention-days: 7
          path: |
            build/test-results/test/
            build/reports/tests/test/
          if-no-files-found: warn
      - name: Preserve tested production JAR
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ArcJustTeams-${{ github.sha }}
          retention-days: 7
          path: |
            build/libs/ArcJustTeams-*.jar
            !build/libs/*-plain.jar
          if-no-files-found: error
